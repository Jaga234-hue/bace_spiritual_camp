<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiritual Camp Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        
        .mobile-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        .scrollable-form {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 80px; /* Space for fixed submit button */
        }
        
        .fixed-submit-btn {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: white;
            border-top: 1px solid #e5e7eb;
        }
        
        /* Custom scrollbar */
        .scrollable-form::-webkit-scrollbar {
            width: 6px;
        }
        
        .scrollable-form::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        
        .scrollable-form::-webkit-scrollbar-thumb {
            background: #c5c5c5;
            border-radius: 10px;
        }
        
        .scrollable-form::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
        
        /* Ensure form elements are mobile-friendly */
        input, button {
            font-size: 16px !important; /* Prevents zoom on iOS */
        }
        
        /* Safe area for notched phones */
        @supports(padding: max(0px)) {
            .fixed-submit-btn {
                padding-bottom: max(12px, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <div class="mobile-container bg-white">
        <!-- Fixed Header -->
        <div class="bg-gradient-to-r from-purple-700 to-purple-500 text-white p-6 text-center shadow-lg sticky top-0 z-50">
            <h1 class="text-2xl font-bold">Spiritual Camp</h1>
            <p class="text-white/90 mt-1">Registration Form</p>
        </div>
        
        <!-- Scrollable Form Content -->
        <div class="scrollable-form p-6">
            <form id="registrationForm" action="submit.php" method="POST" enctype="multipart/form-data">
                <div class="space-y-6">
                    <!-- Personal Information -->
                    <div class="space-y-4">
                        <div>
                            <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                                <i class="fas fa-user mr-2"></i>Full Name
                            </label>
                            <input type="text" id="name" name="name" required 
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all duration-200"
                                   placeholder="Enter your full name">
                        </div>
                        
                        <div>
                            <label for="regd_no" class="block text-sm font-medium text-gray-700 mb-2">
                                <i class="fas fa-id-card mr-2"></i>Registration Number
                            </label>
                            <input type="text" id="regd_no" name="regd_no" required 
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all duration-200"
                                   placeholder="Enter registration number">
                        </div>
                        
                        <div>
                            <label for="room_no" class="block text-sm font-medium text-gray-700 mb-2">
                                <i class="fas fa-door-open mr-2"></i>Room Number
                            </label>
                            <input type="text" id="room_no" name="room_no" required 
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all duration-200"
                                   placeholder="Enter room number">
                        </div>
                        
                        <div>
                            <label for="phone_no" class="block text-sm font-medium text-gray-700 mb-2">
                                <i class="fas fa-phone mr-2"></i>Phone Number
                            </label>
                            <input type="tel" id="phone_no" name="phone_no" required 
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all duration-200"
                                   placeholder="Enter phone number"
                                   pattern="[0-9]{10}">
                        </div>
                    </div>
                    
                    <!-- Divider -->
                    <div class="border-t border-gray-200 my-6"></div>
                    
                    <!-- Payment Section -->
                    <div class="bg-purple-50 border-2 border-dashed border-purple-500 rounded-xl p-5">
                        <h3 class="text-lg font-semibold text-purple-700 text-center mb-4">
                            <i class="fas fa-money-bill-wave mr-2"></i>Payment Details
                        </h3>
                        
                        <div class="bg-white rounded-lg p-4 border-l-4 border-purple-500 mb-4">
                            <div class="flex justify-between py-1">
                                <span class="font-medium">Amount:</span>
                                <span class="font-bold text-purple-700">₹200</span>
                            </div>
                            <div class="flex justify-between py-1">
                                <span class="font-medium">UPI ID:</span>
                                <span class="font-mono text-sm">9861828508@ybl</span>
                            </div>
                        </div>
                        
                        <button type="button" id="payButton" 
                                class="w-full bg-gradient-to-r from-purple-600 to-purple-500 text-white py-4 rounded-lg font-semibold shadow-lg hover:shadow-xl active:scale-95 transition-all duration-200 mb-4">
                            <i class="fas fa-mobile-alt mr-2"></i>Pay ₹200 Using UPI App
                        </button>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                <i class="fas fa-camera mr-2"></i>Screenshot of your payment
                            </label>
                            <div class="relative">
                                <input type="file" id="screenshot" name="screenshot" accept="image/*" required 
                                       class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                                <div id="fileInputDisplay" class="border-2 border-dashed border-gray-300 rounded-lg py-4 text-center text-gray-500 bg-gray-50 hover:bg-gray-100 transition-all duration-200">
                                    <i class="fas fa-upload mr-2"></i>Upload Payment Screenshot
                                </div>
                            </div>
                            <p class="text-xs text-gray-500 mt-2">Supported formats: JPG, PNG, GIF (Max 5MB)</p>
                        </div>
                    </div>
                    
                    <!-- Questions -->
                    <div>
                        <label for="any_question" class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-question-circle mr-2"></i>Any Question
                        </label>
                        <input type="text" id="any_question" name="any_question" 
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all duration-200"
                               placeholder="Enter your questions (optional)">
                    </div>
                </div>
            </form>
        </div>
        
        <!-- Fixed Submit Button - ALWAYS VISIBLE -->
        <div class="fixed-submit-btn p-4">
            <button type="button" id="submitButton" 
                    class="w-full bg-gradient-to-r from-green-500 to-green-600 text-white py-4 rounded-lg font-semibold text-lg shadow-lg hover:shadow-xl active:scale-95 transition-all duration-200">
                <i class="fas fa-paper-plane mr-2"></i>Submit Registration
            </button>
        </div>
    </div>
    
    <!-- Preview Popup -->
    <div id="previewPopup" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 hidden p-4">
        <div class="bg-white rounded-2xl w-full max-w-md overflow-hidden shadow-2xl">
            <div class="bg-gradient-to-r from-purple-700 to-purple-500 text-white p-5 flex justify-between items-center">
                <h2 class="text-xl font-bold">Registration Preview</h2>
                <button id="closePopup" class="text-white text-2xl hover:text-gray-200 transition">&times;</button>
            </div>
            
            <div class="p-5 max-h-96 overflow-y-auto">
                <div class="space-y-4">
                    <div class="flex justify-between border-b pb-2">
                        <span class="font-medium text-gray-600">Name:</span>
                        <span id="previewName" class="text-gray-800 text-right"></span>
                    </div>
                    <div class="flex justify-between border-b pb-2">
                        <span class="font-medium text-gray-600">Registration No:</span>
                        <span id="previewRegdNo" class="text-gray-800 text-right"></span>
                    </div>
                    <div class="flex justify-between border-b pb-2">
                        <span class="font-medium text-gray-600">Room No:</span>
                        <span id="previewRoomNo" class="text-gray-800 text-right"></span>
                    </div>
                    <div class="flex justify-between border-b pb-2">
                        <span class="font-medium text-gray-600">Phone No:</span>
                        <span id="previewPhoneNo" class="text-gray-800 text-right"></span>
                    </div>
                    <div class="flex justify-between border-b pb-2">
                        <span class="font-medium text-gray-600">Payment Screenshot:</span>
                        <span id="previewScreenshot" class="text-gray-800 text-right text-sm"></span>
                    </div>
                    <div class="flex justify-between border-b pb-2">
                        <span class="font-medium text-gray-600">Questions:</span>
                        <span id="previewQuestion" class="text-gray-800 text-right"></span>
                    </div>
                </div>
            </div>
            
            <div class="p-5 border-t flex gap-3">
                <button id="editButton" class="flex-1 bg-gray-200 text-gray-800 py-3 rounded-lg font-semibold hover:bg-gray-300 active:scale-95 transition-all duration-200">
                    Edit Details
                </button>
                <button id="confirmButton" class="flex-1 bg-gradient-to-r from-green-500 to-green-600 text-white py-3 rounded-lg font-semibold hover:shadow-lg active:scale-95 transition-all duration-200">
                    Confirm Registration
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('registrationForm');
            const submitButton = document.getElementById('submitButton');
            const payButton = document.getElementById('payButton');
            const fileInput = document.getElementById('screenshot');
            const fileInputDisplay = document.getElementById('fileInputDisplay');
            const previewPopup = document.getElementById('previewPopup');
            const closePopup = document.getElementById('closePopup');
            const editButton = document.getElementById('editButton');
            const confirmButton = document.getElementById('confirmButton');
            
            // Handle payment button click
            payButton.addEventListener('click', function() {
                const upiId = '9861828508@ybl';
                const amount = '200';
                const name = 'Spiritual Camp';
                const note = 'Spiritual Camp Registration Fee';
                
                const upiUrl = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(name)}&am=${amount}&cu=INR&tn=${encodeURIComponent(note)}`;
                
                // Try to open UPI app
                window.location.href = upiUrl;
                
                // Fallback message
                setTimeout(function() {
                    if (!document.hidden) {
                        alert('If UPI app did not open, please manually open your UPI app and send ₹200 to: ' + upiId);
                    }
                }, 1000);
            });
            
            // Update file input display
            fileInput.addEventListener('change', function() {
                if (this.files && this.files[0]) {
                    const file = this.files[0];
                    const fileName = file.name.length > 20 
                        ? file.name.substring(0, 17) + '...' 
                        : file.name;
                        
                    fileInputDisplay.innerHTML = `<i class="fas fa-check mr-2"></i>${fileName}`;
                    fileInputDisplay.classList.remove('text-gray-500', 'bg-gray-50', 'border-gray-300');
                    fileInputDisplay.classList.add('text-green-700', 'bg-green-50', 'border-green-400');
                } else {
                    fileInputDisplay.innerHTML = '<i class="fas fa-upload mr-2"></i>Upload Payment Screenshot';
                    fileInputDisplay.classList.remove('text-green-700', 'bg-green-50', 'border-green-400');
                    fileInputDisplay.classList.add('text-gray-500', 'bg-gray-50', 'border-gray-300');
                }
            });
            
            // Handle form submission preview
            submitButton.addEventListener('click', function() {
                const name = document.getElementById('name').value.trim();
                const regdNo = document.getElementById('regd_no').value.trim();
                const roomNo = document.getElementById('room_no').value.trim();
                const phoneNo = document.getElementById('phone_no').value.trim();
                const screenshot = document.getElementById('screenshot').files[0];
                const question = document.getElementById('any_question').value.trim();
                
                // Validation
                if (!name) {
                    alert('Please enter your full name.');
                    document.getElementById('name').focus();
                    return;
                }
                
                if (!regdNo) {
                    alert('Please enter your registration number.');
                    document.getElementById('regd_no').focus();
                    return;
                }
                
                if (!roomNo) {
                    alert('Please enter your room number.');
                    document.getElementById('room_no').focus();
                    return;
                }
                
                if (!phoneNo) {
                    alert('Please enter your phone number.');
                    document.getElementById('phone_no').focus();
                    return;
                }
                
                const phoneRegex = /^[0-9]{10}$/;
                const cleanPhone = phoneNo.replace(/\D/g, '');
                if (!phoneRegex.test(cleanPhone)) {
                    alert('Please enter a valid 10-digit phone number.');
                    document.getElementById('phone_no').focus();
                    return;
                }
                
                if (!screenshot) {
                    alert('Please upload payment screenshot.');
                    fileInput.click();
                    return;
                }
                
                // Populate preview popup
                document.getElementById('previewName').textContent = name || 'Not provided';
                document.getElementById('previewRegdNo').textContent = regdNo || 'Not provided';
                document.getElementById('previewRoomNo').textContent = roomNo || 'Not provided';
                document.getElementById('previewPhoneNo').textContent = phoneNo || 'Not provided';
                document.getElementById('previewScreenshot').textContent = screenshot ? screenshot.name : 'Not uploaded';
                document.getElementById('previewQuestion').textContent = question || 'None';
                
                // Show the preview popup
                previewPopup.classList.remove('hidden');
            });
            
            // Close popup
            closePopup.addEventListener('click', function() {
                previewPopup.classList.add('hidden');
            });
            
            // Edit button in popup
            editButton.addEventListener('click', function() {
                previewPopup.classList.add('hidden');
            });
            
            // Confirm registration
            confirmButton.addEventListener('click', function() {
                // Show loading state
                const originalText = confirmButton.innerHTML;
                confirmButton.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Processing...';
                confirmButton.disabled = true;
                
                // Submit the form
                form.submit();
            });
            
            // Close popup when clicking outside
            previewPopup.addEventListener('click', function(e) {
                if (e.target === previewPopup) {
                    previewPopup.classList.add('hidden');
                }
            });
            
            // Add input validation styles
            const inputs = document.querySelectorAll('input[type="text"], input[type="tel"]');
            inputs.forEach(input => {
                input.addEventListener('blur', function() {
                    if (this.value.trim() !== '') {
                        this.classList.add('border-green-400', 'bg-green-50');
                    } else {
                        this.classList.remove('border-green-400', 'bg-green-50');
                    }
                });
                
                // Real-time validation for phone number
                if (input.id === 'phone_no') {
                    input.addEventListener('input', function() {
                        this.value = this.value.replace(/\D/g, '').substring(0, 10);
                    });
                }
            });
            
            // Prevent form from being submitted on Enter key press
            form.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && e.target.type !== 'submit') {
                    e.preventDefault();
                }
            });
            
            // Handle mobile viewport height issues
            function setViewportHeight() {
                let vh = window.innerHeight * 0.01;
                document.documentElement.style.setProperty('--vh', `${vh}px`);
            }
            
            setViewportHeight();
            window.addEventListener('resize', setViewportHeight);
            window.addEventListener('orientationchange', setViewportHeight);
        });
    </script>
</body>
</html>
