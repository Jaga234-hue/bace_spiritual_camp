<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiritual Camp Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex align-items-center min-vh-100">
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-lg">
                    <div class="card-header text-white text-center py-4">
                        <h1 class="h3 mb-1">Spiritual Camp</h1>
                        <p class="mb-0 opacity-75">Registration Form</p>
                    </div>
                    
                    <div class="card-body p-4">
                        <form id="registrationForm" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="name" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="name" name="name" placeholder="Enter your full name" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="regd_no" class="form-label">Registration Number</label>
                                <input type="text" class="form-control" id="regd_no" name="regd_no" placeholder="Enter registration number" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="room_no" class="form-label">Room Number</label>
                                <input type="text" class="form-control" id="room_no" name="room_no" placeholder="Enter room number" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="phone_no" class="form-label">Phone Number</label>
                                <input type="text" class="form-control" id="phone_no" name="phone_no" placeholder="Enter phone number" required>
                            </div>
                            
                            <hr class="my-4">
                            
                            <div class="payment-section p-3 mb-4 rounded">
                                <h5 class="text-center mb-3">Payment Details</h5>
                                <div class="payment-info bg-white p-3 rounded mb-3">
                                    <div class="d-flex justify-content-between">
                                        <span><strong>Amount:</strong></span>
                                        <span class="text-success">₹200</span>
                                    </div>
                                    <div class="d-flex justify-content-between">
                                        <span><strong>UPI ID:</strong></span>
                                        <span class="text-primary">9861828508@ybl</span>
                                    </div>
                                </div>
                                
                                <button type="button" class="btn btn-primary w-100 mb-3" id="payButton">
                                    Pay ₹200 Using UPI App
                                </button>
                                
                                <div class="mb-3">
                                    <label for="screenshot" class="form-label">Screenshot of your payment</label>
                                    <input type="file" class="form-control" id="screenshot" name="screenshot" accept="image/*" required>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label for="any_question" class="form-label">Any Question</label>
                                <input type="text" class="form-control" id="any_question" name="any_question" placeholder="Enter your questions (optional)">
                            </div>
                            
                            <button type="submit" class="btn btn-success w-100 py-3 fs-5" id="submitButton">
                                Submit Registration
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="modal fade" id="successModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">Registration Successful</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center py-4">
                    <div class="mb-3">
                        <i class="fas fa-check-circle text-success" style="font-size: 3rem;"></i>
                    </div>
                    <p class="mb-0">Your registration has been submitted successfully!</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success w-100" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/your-fontawesome-kit.js"></script>
    <script src="script.js"></script>
</body>
</html>
