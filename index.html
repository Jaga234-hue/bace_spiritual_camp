<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiritual Camp Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            overflow: hidden;
        }
        .form-container {
            height: calc(100vh - 140px);
            overflow-y: auto;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-600 to-blue-500 h-screen flex items-center justify-center p-0 m-0">
    <div class="w-full h-full flex flex-col bg-white">
        <!-- Fixed Header -->
        <div class="bg-gradient-to-r from-purple-700 to-purple-500 text-white p-6 text-center shadow-lg">
            <h1 class="text-2xl font-bold">Spiritual Camp</h1>
            <p class="text-sm opacity-90 mt-1">Registration Form</p>
        </div>
        
        <!-- Scrollable Form Content -->
        <div class="form-container p-6 flex-1">
            <form id="registrationForm" class="space-y-6">
                <!-- Name Field -->
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
                    <input type="text" id="name" name="name" required 
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition"
                           placeholder="Enter your full name">
                </div>
                
                <!-- Registration Number -->
                <div>
                    <label for="regd_no" class="block text-sm font-medium text-gray-700 mb-2">Registration Number</label>
                    <input type="text" id="regd_no" name="regd_no" required 
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition"
                           placeholder="Enter registration number">
                </div>
                
                <!-- Room Number -->
                <div>
                    <label for="room_no" class="block text-sm font-medium text-gray-700 mb-2">Room Number</label>
                    <input type="text" id="room_no" name="room_no" required 
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition"
                           placeholder="Enter room number">
                </div>
                
                <!-- Phone Number -->
                <div>
                    <label for="phone_no" class="block text-sm font-medium text-gray-700 mb-2">Phone Number</label>
                    <input type="text" id="phone_no" name="phone_no" required 
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition"
                           placeholder="Enter phone number">
                </div>
                
                <!-- Divider -->
                <div class="border-t border-gray-200 my-6"></div>
                
                <!-- Payment Section -->
                <div class="bg-purple-50 border-2 border-dashed border-purple-300 rounded-xl p-5">
                    <h3 class="text-lg font-semibold text-purple-700 text-center mb-4">Payment Details</h3>
                    
                    <div class="bg-white rounded-lg p-4 border-l-4 border-purple-500 mb-4">
                        <p class="flex justify-between"><span class="font-medium">Amount:</span> <span class="font-bold text-purple-600">₹200</span></p>
                        <p class="flex justify-between mt-2"><span class="font-medium">UPI ID:</span> <span class="font-mono">9861828508@ybl</span></p>
                    </div>
                    
                    <!-- Pay Button -->
                    <button type="button" id="payButton" 
                            class="w-full bg-gradient-to-r from-purple-600 to-purple-800 text-white py-3 rounded-lg font-semibold shadow-md hover:shadow-lg transition mb-4">
                        Pay ₹200 Using UPI App
                    </button>
                    
                    <!-- File Upload -->
                    <div>
                        <label for="screenshot" class="block text-sm font-medium text-gray-700 mb-2">Screenshot of your payment</label>
                        <div class="relative">
                            <input type="file" id="screenshot" name="screenshot" accept="image/*" required 
                                   class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                            <div class="border-2 border-dashed border-gray-300 rounded-lg py-4 text-center bg-gray-50 hover:bg-gray-100 transition">
                                <span id="fileText" class="text-gray-500">Upload Screenshot</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Questions -->
                <div>
                    <label for="any_question" class="block text-sm font-medium text-gray-700 mb-2">Any Question</label>
                    <input type="text" id="any_question" name="any_question" 
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition"
                           placeholder="Enter your questions (optional)">
                </div>
            </form>
        </div>
        
        <!-- Fixed Submit Button -->
        <div class="bg-white p-4 border-t border-gray-200 shadow-lg">
            <button type="button" id="submitButton" 
                    class="w-full bg-gradient-to-r from-green-500 to-green-600 text-white py-4 rounded-lg font-bold text-lg shadow-md hover:shadow-lg transition">
                Submit Registration
            </button>
        </div>
    </div>
    
    <!-- Preview Popup -->
    <div id="previewPopup" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-xl w-full max-w-md overflow-hidden shadow-2xl">
            <div class="bg-gradient-to-r from-purple-700 to-purple-500 text-white p-5 flex justify-between items-center">
                <h2 class="text-xl font-bold">Registration Preview</h2>
                <button id="closePopup" class="text-white text-2xl">&times;</button>
            </div>
            
            <div class="p-5 max-h-96 overflow-y-auto">
                <div class="space-y-4">
                    <div class="flex border-b border-gray-200 pb-3">
                        <span class="font-medium text-gray-700 w-2/5">Name:</span>
                        <span id="previewName" class="text-gray-900"></span>
                    </div>
                    <div class="flex border-b border-gray-200 pb-3">
                        <span class="font-medium text-gray-700 w-2/5">Registration No:</span>
                        <span id="previewRegdNo" class="text-gray-900"></span>
                    </div>
                    <div class="flex border-b border-gray-200 pb-3">
                        <span class="font-medium text-gray-700 w-2/5">Room No:</span>
                        <span id="previewRoomNo" class="text-gray-900"></span>
                    </div>
                    <div class="flex border-b border-gray-200 pb-3">
                        <span class="font-medium text-gray-700 w-2/5">Phone No:</span>
                        <span id="previewPhoneNo" class="text-gray-900"></span>
                    </div>
                    <div class="flex border-b border-gray-200 pb-3">
                        <span class="font-medium text-gray-700 w-2/5">Payment Screenshot:</span>
                        <span id="previewScreenshot" class="text-gray-900"></span>
                    </div>
                    <div class="flex">
                        <span class="font-medium text-gray-700 w-2/5">Questions:</span>
                        <span id="previewQuestion" class="text-gray-900"></span>
                    </div>
                </div>
            </div>
            
            <div class="p-5 border-t border-gray-200 flex gap-3">
                <button id="editButton" class="flex-1 bg-gray-200 text-gray-800 py-3 rounded-lg font-medium hover:bg-gray-300 transition">
                    Edit Details
                </button>
                <button id="confirmButton" class="flex-1 bg-gradient-to-r from-green-500 to-green-600 text-white py-3 rounded-lg font-medium hover:shadow-lg transition">
                    Confirm Registration
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('registrationForm');
            const submitButton = document.getElementById('submitButton');
            const payButton = document.getElementById('payButton');
            const fileInput = document.getElementById('screenshot');
            const fileText = document.getElementById('fileText');
            const previewPopup = document.getElementById('previewPopup');
            const closePopup = document.getElementById('closePopup');
            const editButton = document.getElementById('editButton');
            const confirmButton = document.getElementById('confirmButton');
            
            // Handle payment button click
            payButton.addEventListener('click', function() {
                const upiId = '9861828508@ybl';
                const amount = '200';
                const name = 'Spiritual Camp';
                const note = 'Spiritual Camp Registration Fee';
                
                const upiUrl = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(name)}&am=${amount}&cu=INR&tn=${encodeURIComponent(note)}`;
                
                window.location.href = upiUrl;
                
                setTimeout(function() {
                    alert('If UPI app did not open, please manually open your UPI app and send ₹200 to: ' + upiId);
                }, 500);
            });
            
            // Update file input text
            fileInput.addEventListener('change', function() {
                if (this.files && this.files[0]) {
                    const fileName = this.files[0].name.length > 20 
                        ? this.files[0].name.substring(0, 17) + '...' 
                        : this.files[0].name;
                        
                    fileText.textContent = fileName;
                    fileText.classList.remove('text-gray-500');
                    fileText.classList.add('text-green-600', 'font-medium');
                } else {
                    fileText.textContent = 'Upload Screenshot';
                    fileText.classList.remove('text-green-600', 'font-medium');
                    fileText.classList.add('text-gray-500');
                }
            });
            
            // Handle form submission preview
            submitButton.addEventListener('click', function() {
                const name = document.getElementById('name').value;
                const regdNo = document.getElementById('regd_no').value;
                const roomNo = document.getElementById('room_no').value;
                const phoneNo = document.getElementById('phone_no').value;
                const screenshot = document.getElementById('screenshot').files[0];
                const question = document.getElementById('any_question').value;
                
                if (!name || !regdNo || !roomNo || !phoneNo || !screenshot) {
                    alert('Please fill in all required fields and upload payment screenshot.');
                    return;
                }
                
                const phoneRegex = /^[0-9]{10}$/;
                const cleanPhone = phoneNo.replace(/\D/g, '');
                if (!phoneRegex.test(cleanPhone)) {
                    alert('Please enter a valid 10-digit phone number.');
                    return;
                }
                
                document.getElementById('previewName').textContent = name;
                document.getElementById('previewRegdNo').textContent = regdNo;
                document.getElementById('previewRoomNo').textContent = roomNo;
                document.getElementById('previewPhoneNo').textContent = phoneNo;
                document.getElementById('previewScreenshot').textContent = screenshot ? screenshot.name : 'Not uploaded';
                document.getElementById('previewQuestion').textContent = question || 'None';
                
                previewPopup.classList.remove('hidden');
            });
            
            // Close popup
            closePopup.addEventListener('click', function() {
                previewPopup.classList.add('hidden');
            });
            
            // Edit button in popup
            editButton.addEventListener('click', function() {
                previewPopup.classList.add('hidden');
            });
            
            // Confirm registration
            confirmButton.addEventListener('click', function() {
                const formData = new FormData(form);
                
                const originalText = confirmButton.innerHTML;
                confirmButton.innerHTML = 'Processing...';
                confirmButton.disabled = true;
                
                fetch('submit.php', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('Registration confirmed successfully! We will contact you soon.');
                        form.reset();
                        fileText.textContent = 'Upload Screenshot';
                        fileText.classList.remove('text-green-600', 'font-medium');
                        fileText.classList.add('text-gray-500');
                        previewPopup.classList.add('hidden');
                    } else {
                        alert('Error: ' + data.message);
                    }
                })
                .catch(error => {
                    alert('Network error. Please try again.');
                    console.error('Error:', error);
                })
                .finally(() => {
                    confirmButton.innerHTML = originalText;
                    confirmButton.disabled = false;
                });
            });
            
            // Close popup when clicking outside
            previewPopup.addEventListener('click', function(e) {
                if (e.target === previewPopup) {
                    previewPopup.classList.add('hidden');
                }
            });
        });
    </script>
</body>
</html>
