<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiritual Camp Registration</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>Spiritual Camp</h1>
                <p>Registration Form</p>
            </div>
            
            <div class="body">
                <form id="registrationForm">
                    <div class="form-section">
                        <div class="form-group">
                            <label for="name">Full Name</label>
                            <input type="text" id="name" placeholder="Enter your full name" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="regd_no">Registration Number</label>
                            <input type="text" id="regd_no" placeholder="Enter registration number" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="room_no">Room Number</label>
                            <input type="text" id="room_no" placeholder="Enter room number" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="phone_no">Phone Number</label>
                            <input type="text" id="phone_no" placeholder="Enter phone number" required>
                        </div>
                    </div>
                    
                    <div class="divider"></div>
                    
                    <div class="payment-section">
                        <h3>Payment Details</h3>
                        <div class="payment-info">
                            <div class="payment-item">
                                <span class="payment-label">Amount:</span>
                                <span class="payment-value">₹200</span>
                            </div>
                            <div class="payment-item">
                                <span class="payment-label">UPI ID:</span>
                                <span class="payment-value">9861828508@ybl</span>
                            </div>
                        </div>
                        
                        <button type="button" class="btn btn-pay" id="payButton">
                            Pay ₹200 Using UPI App
                        </button>
                        
                        <div class="form-group">
                            <label for="screenshot">Screenshot of your payment</label>
                            <div class="file-input-wrapper">
                                <div class="file-input-button">
                                    <i class="fas fa-cloud-upload-alt"></i> Upload Screenshot
                                </div>
                                <input type="file" id="screenshot" accept="image/*" required>
                            </div>
                        </div>
                    </div>
                    
                    <div class="divider"></div>
                    
                    <div class="form-group">
                        <label for="any_question">Any Question</label>
                        <input type="text" id="any_question" placeholder="Enter your questions (optional)">
                    </div>
                </form>
            </div>
        </div>
        
        <button type="submit" class="btn btn-submit" id="submitButton">
            Submit Registration
        </button>
    </div>
    
    <!-- Preview Popup -->
    <div class="popup-overlay" id="previewPopup">
        <div class="popup-content">
            <div class="popup-header">
                <h2>Registration Preview</h2>
                <button class="popup-close" id="closePopup">&times;</button>
            </div>
            <div class="popup-body">
                <div class="preview-item">
                    <span class="preview-label">Name:</span>
                    <span class="preview-value" id="previewName"></span>
                </div>
                <div class="preview-item">
                    <span class="preview-label">Registration No:</span>
                    <span class="preview-value" id="previewRegdNo"></span>
                </div>
                <div class="preview-item">
                    <span class="preview-label">Room No:</span>
                    <span class="preview-value" id="previewRoomNo"></span>
                </div>
                <div class="preview-item">
                    <span class="preview-label">Phone No:</span>
                    <span class="preview-value" id="previewPhoneNo"></span>
                </div>
                <div class="preview-item">
                    <span class="preview-label">Payment Screenshot:</span>
                    <span class="preview-value" id="previewScreenshot"></span>
                </div>
                <div class="preview-item">
                    <span class="preview-label">Questions:</span>
                    <span class="preview-value" id="previewQuestion"></span>
                </div>
            </div>
            <div class="popup-footer">
                <button class="btn btn-edit" id="editButton">Edit Details</button>
                <button class="btn btn-confirm" id="confirmButton">Confirm Registration</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
