<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiritual Camp Registration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #333;
            line-height: 1.5;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .card {
            background-color: white;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(to right, #4A00E0, #8E2DE2);
            color: white;
            padding: 20px;
            text-align: center;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .body {
            padding: 20px;
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
            font-size: 1rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px;
            border: 2px solid #e1e1e1;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background-color: #f9f9f9;
        }

        input[type="text"]:focus {
            border-color: #6a11cb;
            background-color: white;
            outline: none;
            box-shadow: 0 0 0 3px rgba(106, 17, 203, 0.1);
        }

        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, #ccc, transparent);
            margin: 20px 0;
        }

        .payment-section {
            background-color: #f8f9ff;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            border: 2px dashed #6a11cb;
        }

        .payment-section h3 {
            color: #6a11cb;
            margin-bottom: 15px;
            font-size: 1.2rem;
            text-align: center;
        }

        .payment-info {
            background-color: white;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            border-left: 4px solid #6a11cb;
            font-size: 1rem;
        }

        .payment-info p {
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
        }

        .payment-info strong {
            color: #4A00E0;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .btn-pay {
            background: linear-gradient(to right, #4A00E0, #8E2DE2);
            color: white;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(106, 17, 203, 0.3);
        }

        .btn-pay:active {
            transform: translateY(2px);
            box-shadow: 0 2px 10px rgba(106, 17, 203, 0.3);
        }

        .btn-submit {
            background: linear-gradient(to right, #00b09b, #96c93d);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 176, 155, 0.3);
            width: 100%;
        }

        .btn-submit:active {
            transform: translateY(2px);
            box-shadow: 0 2px 10px rgba(0, 176, 155, 0.3);
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .file-input-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #f0f0f0;
            padding: 16px;
            border-radius: 10px;
            border: 2px dashed #ccc;
            font-weight: 500;
            color: #555;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .file-input-wrapper:active .file-input-button {
            background-color: #e9e9e9;
            border-color: #6a11cb;
            color: #6a11cb;
        }

        /* Custom scrollbar for the form body */
        .body::-webkit-scrollbar {
            width: 6px;
        }

        .body::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .body::-webkit-scrollbar-thumb {
            background: #c5c5c5;
            border-radius: 10px;
        }

        .body::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }

        /* Popup Styles */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .popup-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .popup-content {
            background-color: white;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            transform: translateY(20px);
            transition: transform 0.4s ease;
        }

        .popup-overlay.active .popup-content {
            transform: translateY(0);
        }

        .popup-header {
            background: linear-gradient(to right, #4A00E0, #8E2DE2);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .popup-header h2 {
            font-size: 1.4rem;
            font-weight: 600;
        }

        .popup-close {
            background: none;
            border: none;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            line-height: 1;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .popup-body {
            padding: 20px;
            max-height: 50vh;
            overflow-y: auto;
        }

        .preview-item {
            display: flex;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid #eee;
        }

        .preview-label {
            font-weight: 600;
            color: #555;
            width: 45%;
            flex-shrink: 0;
        }

        .preview-value {
            color: #333;
            word-break: break-word;
        }

        .popup-footer {
            padding: 20px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #eee;
        }

        .popup-footer .btn {
            width: auto;
            flex: 1;
            padding: 14px;
        }

        .btn-edit {
            background: #f0f0f0;
            color: #555;
        }

        .btn-confirm {
            background: linear-gradient(to right, #00b09b, #96c93d);
            color: white;
        }

        /* Media queries for different screen sizes */
        @media (max-height: 700px) {
            .body {
                padding: 15px;
            }
            
            .form-group {
                margin-bottom: 15px;
            }
            
            .payment-section {
                padding: 15px;
                margin: 15px 0;
            }
            
            input[type="text"] {
                padding: 14px;
            }
            
            .btn {
                padding: 16px;
            }
        }

        @media (max-height: 600px) {
            .header {
                padding: 15px;
            }
            
            .body {
                padding: 12px;
            }
            
            .form-group {
                margin-bottom: 12px;
            }
            
            .payment-section {
                padding: 12px;
                margin: 12px 0;
            }
            
            input[type="text"] {
                padding: 12px;
            }
            
            .btn {
                padding: 14px;
            }
        }

        @media (max-width: 350px) {
            .header h1 {
                font-size: 1.5rem;
            }
            
            .popup-footer {
                flex-direction: column;
            }
            
            .popup-footer .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>Spiritual Camp</h1>
                <p>Registration Form</p>
            </div>
            
            <div class="body">
                <form id="registrationForm">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="Enter your full name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="regd_no">Registration Number</label>
                        <input type="text" id="regd_no" placeholder="Enter registration number" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="room_no">Room Number</label>
                        <input type="text" id="room_no" placeholder="Enter room number" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="phone_no">Phone Number</label>
                        <input type="text" id="phone_no" placeholder="Enter phone number" required>
                    </div>
                    
                    <div class="divider"></div>
                    
                    <div class="payment-section">
                        <h3>Payment Details</h3>
                        <div class="payment-info">
                            <p><strong>Amount:</strong> ₹200</p>
                            <p><strong>UPI ID:</strong> 9861828508@ybl</p>
                        </div>
                        
                        <button type="button" class="btn btn-pay" id="payButton">
                            Pay ₹200 Using UPI App
                        </button>
                        
                        <div class="form-group">
                            <label for="screenshot">Screenshot of your payment</label>
                            <div class="file-input-wrapper">
                                <div class="file-input-button">
                                    Upload Screenshot
                                </div>
                                <input type="file" id="screenshot" accept="image/*" required>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="any_question">Any Question</label>
                        <input type="text" id="any_question" placeholder="Enter your questions (optional)">
                    </div>
                </form>
            </div>
        </div>
        
        <button type="button" class="btn btn-submit" id="submitButton">
            Submit Registration
        </button>
    </div>
    
    <!-- Preview Popup -->
    <div class="popup-overlay" id="previewPopup">
        <div class="popup-content">
            <div class="popup-header">
                <h2>Registration Preview</h2>
                <button class="popup-close" id="closePopup">&times;</button>
            </div>
            <div class="popup-body">
                <div class="preview-item">
                    <span class="preview-label">Name:</span>
                    <span class="preview-value" id="previewName"></span>
                </div>
                <div class="preview-item">
                    <span class="preview-label">Registration No:</span>
                    <span class="preview-value" id="previewRegdNo"></span>
                </div>
                <div class="preview-item">
                    <span class="preview-label">Room No:</span>
                    <span class="preview-value" id="previewRoomNo"></span>
                </div>
                <div class="preview-item">
                    <span class="preview-label">Phone No:</span>
                    <span class="preview-value" id="previewPhoneNo"></span>
                </div>
                <div class="preview-item">
                    <span class="preview-label">Payment Screenshot:</span>
                    <span class="preview-value" id="previewScreenshot"></span>
                </div>
                <div class="preview-item">
                    <span class="preview-label">Questions:</span>
                    <span class="preview-value" id="previewQuestion"></span>
                </div>
            </div>
            <div class="popup-footer">
                <button class="btn btn-edit" id="editButton">Edit Details</button>
                <button class="btn btn-confirm" id="confirmButton">Confirm Registration</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('registrationForm');
            const submitButton = document.getElementById('submitButton');
            const payButton = document.getElementById('payButton');
            const fileInput = document.getElementById('screenshot');
            const fileInputButton = document.querySelector('.file-input-button');
            const previewPopup = document.getElementById('previewPopup');
            const closePopup = document.getElementById('closePopup');
            const editButton = document.getElementById('editButton');
            const confirmButton = document.getElementById('confirmButton');
            
            // Handle payment button click
            payButton.addEventListener('click', function() {
                // UPI deep link - this will try to open UPI apps if installed
                const upiId = '9861828508@ybl';
                const amount = '200';
                const name = 'Spiritual Camp';
                const note = 'Spiritual Camp Registration Fee';
                
                // Create UPI URL
                const upiUrl = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(name)}&am=${amount}&cu=INR&tn=${encodeURIComponent(note)}`;
                
                // Try to open UPI app
                window.location.href = upiUrl;
                
                // Fallback: Show instructions if UPI app not available
                setTimeout(function() {
                    alert('If UPI app did not open, please manually open your UPI app and send ₹200 to: ' + upiId);
                }, 500);
            });
            
            // Update file input button text when a file is selected
            fileInput.addEventListener('change', function() {
                if (this.files && this.files[0]) {
                    const fileName = this.files[0].name.length > 20 
                        ? this.files[0].name.substring(0, 17) + '...' 
                        : this.files[0].name;
                        
                    fileInputButton.textContent = fileName;
                    fileInputButton.style.backgroundColor = '#e8f5e9';
                    fileInputButton.style.borderColor = '#4caf50';
                    fileInputButton.style.color = '#2e7d32';
                } else {
                    fileInputButton.textContent = 'Upload Screenshot';
                    fileInputButton.style.backgroundColor = '';
                    fileInputButton.style.borderColor = '';
                    fileInputButton.style.color = '';
                }
            });
            
            // Handle form submission preview
            submitButton.addEventListener('click', function() {
                // Basic validation
                const name = document.getElementById('name').value;
                const regdNo = document.getElementById('regd_no').value;
                const roomNo = document.getElementById('room_no').value;
                const phoneNo = document.getElementById('phone_no').value;
                const screenshot = document.getElementById('screenshot').files[0];
                const question = document.getElementById('any_question').value;
                
                if (!name || !regdNo || !roomNo || !phoneNo || !screenshot) {
                    alert('Please fill in all required fields and upload payment screenshot.');
                    return;
                }
                
                // Phone number validation (basic)
                const phoneRegex = /^[0-9]{10}$/;
                const cleanPhone = phoneNo.replace(/\D/g, '');
                if (!phoneRegex.test(cleanPhone)) {
                    alert('Please enter a valid 10-digit phone number.');
                    return;
                }
                
                // Populate preview popup
                document.getElementById('previewName').textContent = name;
                document.getElementById('previewRegdNo').textContent = regdNo;
                document.getElementById('previewRoomNo').textContent = roomNo;
                document.getElementById('previewPhoneNo').textContent = phoneNo;
                document.getElementById('previewScreenshot').textContent = screenshot ? screenshot.name : 'Not uploaded';
                document.getElementById('previewQuestion').textContent = question || 'None';
                
                // Show the preview popup
                previewPopup.classList.add('active');
            });
            
            // Close popup
            closePopup.addEventListener('click', function() {
                previewPopup.classList.remove('active');
            });
            
            // Edit button in popup
            editButton.addEventListener('click', function() {
                previewPopup.classList.remove('active');
            });
            
            // Confirm registration
            confirmButton.addEventListener('click', function() {
                // Show loading state
                const originalText = confirmButton.innerHTML;
                confirmButton.innerHTML = 'Processing...';
                confirmButton.disabled = true;
                
                // Simulate form submission
                setTimeout(function() {
                    alert('Registration confirmed successfully! We will contact you soon.');
                    form.reset();
                    fileInputButton.textContent = 'Upload Screenshot';
                    fileInputButton.style.backgroundColor = '';
                    fileInputButton.style.borderColor = '';
                    fileInputButton.style.color = '';
                    previewPopup.classList.remove('active');
                    confirmButton.innerHTML = originalText;
                    confirmButton.disabled = false;
                }, 2000);
            });
            
            // Close popup when clicking outside
            previewPopup.addEventListener('click', function(e) {
                if (e.target === previewPopup) {
                    previewPopup.classList.remove('active');
                }
            });
            
            // Add input validation styles
            const inputs = document.querySelectorAll('input[type="text"]');
            inputs.forEach(input => {
                input.addEventListener('blur', function() {
                    if (this.value.trim() !== '') {
                        this.style.backgroundColor = '#f0f8ff';
                        this.style.borderColor = '#6a11cb';
                    } else {
                        this.style.backgroundColor = '';
                        this.style.borderColor = '';
                    }
                });
            });
            
            // Prevent form from being submitted on Enter key press
            form.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && e.target.type !== 'submit') {
                    e.preventDefault();
                }
            });
            
            // Handle orientation change for better mobile experience
            window.addEventListener('orientationchange', function() {
                // Small delay to allow orientation to complete
                setTimeout(function() {
                    // Adjust container height if needed
                    const container = document.querySelector('.container');
                    const viewportHeight = window.innerHeight;
                    
                    if (viewportHeight < 600) {
                        container.style.height = '97vh';
                    } else {
                        container.style.height = '100vh';
                    }
                }, 300);
            });
        });
    </script>
</body>
</html>
