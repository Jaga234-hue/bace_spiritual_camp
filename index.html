<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiritual Camp Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            height: 100vh;
            overflow: hidden;
        }
        
        .scrollable-form {
            height: calc(100vh - 180px);
            overflow-y: auto;
        }
        
        /* Custom scrollbar */
        .scrollable-form::-webkit-scrollbar {
            width: 6px;
        }
        
        .scrollable-form::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        
        .scrollable-form::-webkit-scrollbar-thumb {
            background: #c5c5c5;
            border-radius: 10px;
        }
        
        .scrollable-form::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
    </style>
</head>
<body class="flex items-center justify-center p-0 m-0">
    <div class="w-full h-full flex flex-col bg-white">
        <!-- Fixed Header -->
        <div class="bg-gradient-to-r from-purple-700 to-purple-500 text-white p-6 text-center shadow-lg">
            <h1 class="text-2xl font-bold">Spiritual Camp</h1>
            <p class="text-white/90">Registration Form</p>
        </div>
        
        <!-- Scrollable Form Content -->
        <div class="scrollable-form p-6">
            <form id="registrationForm" action="submit.php" method="POST" enctype="multipart/form-data">
                <div class="space-y-6">
                    <!-- Personal Information -->
                    <div class="space-y-4">
                        <div>
                            <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                                <i class="fas fa-user mr-2"></i>Full Name
                            </label>
                            <input type="text" id="name" name="name" required 
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition"
                                   placeholder="Enter your full name">
                        </div>
                        
                        <div>
                            <label for="regd_no" class="block text-sm font-medium text-gray-700 mb-2">
                                <i class="fas fa-id-card mr-2"></i>Registration Number
                            </label>
                            <input type="text" id="regd_no" name="regd_no" required 
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition"
                                   placeholder="Enter registration number">
                        </div>
                        
                        <div>
                            <label for="room_no" class="block text-sm font-medium text-gray-700 mb-2">
                                <i class="fas fa-door-open mr-2"></i>Room Number
                            </label>
                            <input type="text" id="room_no" name="room_no" required 
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition"
                                   placeholder="Enter room number">
                        </div>
                        
                        <div>
                            <label for="phone_no" class="block text-sm font-medium text-gray-700 mb-2">
                                <i class="fas fa-phone mr-2"></i>Phone Number
                            </label>
                            <input type="text" id="phone_no" name="phone_no" required 
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition"
                                   placeholder="Enter phone number">
                        </div>
                    </div>
                    
                    <!-- Divider -->
                    <div class="border-t border-gray-200 my-6"></div>
                    
                    <!-- Payment Section -->
                    <div class="bg-purple-50 border-2 border-dashed border-purple-500 rounded-xl p-5">
                        <h3 class="text-lg font-semibold text-purple-700 text-center mb-4">
                            <i class="fas fa-money-bill-wave mr-2"></i>Payment Details
                        </h3>
                        
                        <div class="bg-white rounded-lg p-4 border-l-4 border-purple-500 mb-4">
                            <div class="flex justify-between py-1">
                                <span class="font-medium">Amount:</span>
                                <span class="font-bold text-purple-700">₹200</span>
                            </div>
                            <div class="flex justify-between py-1">
                                <span class="font-medium">UPI ID:</span>
                                <span class="font-mono">9861828508@ybl</span>
                            </div>
                        </div>
                        
                        <button type="button" id="payButton" 
                                class="w-full bg-gradient-to-r from-purple-600 to-purple-500 text-white py-4 rounded-lg font-semibold shadow-lg hover:shadow-xl transition mb-4">
                            <i class="fas fa-mobile-alt mr-2"></i>Pay ₹200 Using UPI App
                        </button>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                <i class="fas fa-camera mr-2"></i>Screenshot of your payment
                            </label>
                            <div class="relative">
                                <input type="file" id="screenshot" name="screenshot" accept="image/*" required 
                                       class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                                <div class="border-2 border-dashed border-gray-300 rounded-lg py-4 text-center text-gray-500 bg-gray-50 hover:bg-gray-100 transition">
                                    <i class="fas fa-upload mr-2"></i>Upload Payment Screenshot
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Questions -->
                    <div>
                        <label for="any_question" class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-question-circle mr-2"></i>Any Question
                        </label>
                        <input type="text" id="any_question" name="any_question" 
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition"
                               placeholder="Enter your questions (optional)">
                    </div>
                </div>
            </form>
        </div>
        
        <!-- Fixed Submit Button -->
        <div class="p-4 bg-white border-t border-gray-200">
            <button type="button" id="submitButton" 
                    class="w-full bg-gradient-to-r from-green-500 to-green-600 text-white py-4 rounded-lg font-semibold text-lg shadow-lg hover:shadow-xl transition">
                <i class="fas fa-paper-plane mr-2"></i>Submit Registration
            </button>
        </div>
    </div>
    
    <!-- Preview Popup -->
    <div id="previewPopup" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-2xl w-11/12 max-w-md overflow-hidden shadow-2xl">
            <div class="bg-gradient-to-r from-purple-700 to-purple-500 text-white p-5 flex justify-between items-center">
                <h2 class="text-xl font-bold">Registration Preview</h2>
                <button id="closePopup" class="text-white text-2xl">&times;</button>
            </div>
            
            <div class="p-5 max-h-96 overflow-y-auto">
                <div class="space-y-4">
                    <div class="flex justify-between border-b pb-2">
                        <span class="font-medium text-gray-600">Name:</span>
                        <span id="previewName" class="text-gray-800"></span>
                    </div>
                    <div class="flex justify-between border-b pb-2">
                        <span class="font-medium text-gray-600">Registration No:</span>
                        <span id="previewRegdNo" class="text-gray-800"></span>
                    </div>
                    <div class="flex justify-between border-b pb-2">
                        <span class="font-medium text-gray-600">Room No:</span>
                        <span id="previewRoomNo" class="text-gray-800"></span>
                    </div>
                    <div class="flex justify-between border-b pb-2">
                        <span class="font-medium text-gray-600">Phone No:</span>
                        <span id="previewPhoneNo" class="text-gray-800"></span>
                    </div>
                    <div class="flex justify-between border-b pb-2">
                        <span class="font-medium text-gray-600">Payment Screenshot:</span>
                        <span id="previewScreenshot" class="text-gray-800"></span>
                    </div>
                    <div class="flex justify-between border-b pb-2">
                        <span class="font-medium text-gray-600">Questions:</span>
                        <span id="previewQuestion" class="text-gray-800"></span>
                    </div>
                </div>
            </div>
            
            <div class="p-5 border-t flex gap-3">
                <button id="editButton" class="flex-1 bg-gray-200 text-gray-800 py-3 rounded-lg font-semibold hover:bg-gray-300 transition">
                    Edit Details
                </button>
                <button id="confirmButton" class="flex-1 bg-gradient-to-r from-green-500 to-green-600 text-white py-3 rounded-lg font-semibold hover:shadow-lg transition">
                    Confirm Registration
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('registrationForm');
            const submitButton = document.getElementById('submitButton');
            const payButton = document.getElementById('payButton');
            const fileInput = document.getElementById('screenshot');
            const fileInputButton = fileInput.parentElement.querySelector('div');
            const previewPopup = document.getElementById('previewPopup');
            const closePopup = document.getElementById('closePopup');
            const editButton = document.getElementById('editButton');
            const confirmButton = document.getElementById('confirmButton');
            
            // Handle payment button click
            payButton.addEventListener('click', function() {
                const upiId = '9861828508@ybl';
                const amount = '200';
                const name = 'Spiritual Camp';
                const note = 'Spiritual Camp Registration Fee';
                
                const upiUrl = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(name)}&am=${amount}&cu=INR&tn=${encodeURIComponent(note)}`;
                
                window.location.href = upiUrl;
                
                setTimeout(function() {
                    alert('If UPI app did not open, please manually open your UPI app and send ₹200 to: ' + upiId);
                }, 500);
            });
            
            // Update file input display
            fileInput.addEventListener('change', function() {
                if (this.files && this.files[0]) {
                    const fileName = this.files[0].name.length > 20 
                        ? this.files[0].name.substring(0, 17) + '...' 
                        : this.files[0].name;
                        
                    fileInputButton.innerHTML = `<i class="fas fa-check mr-2"></i>${fileName}`;
                    fileInputButton.classList.remove('text-gray-500', 'bg-gray-50');
                    fileInputButton.classList.add('text-green-700', 'bg-green-50', 'border-green-400');
                } else {
                    fileInputButton.innerHTML = '<i class="fas fa-upload mr-2"></i>Upload Payment Screenshot';
                    fileInputButton.classList.remove('text-green-700', 'bg-green-50', 'border-green-400');
                    fileInputButton.classList.add('text-gray-500', 'bg-gray-50');
                }
            });
            
            // Handle form submission preview
            submitButton.addEventListener('click', function() {
                const name = document.getElementById('name').value;
                const regdNo = document.getElementById('regd_no').value;
                const roomNo = document.getElementById('room_no').value;
                const phoneNo = document.getElementById('phone_no').value;
                const screenshot = document.getElementById('screenshot').files[0];
                const question = document.getElementById('any_question').value;
                
                if (!name || !regdNo || !roomNo || !phoneNo || !screenshot) {
                    alert('Please fill in all required fields and upload payment screenshot.');
                    return;
                }
                
                const phoneRegex = /^[0-9]{10}$/;
                const cleanPhone = phoneNo.replace(/\D/g, '');
                if (!phoneRegex.test(cleanPhone)) {
                    alert('Please enter a valid 10-digit phone number.');
                    return;
                }
                
                // Populate preview popup
                document.getElementById('previewName').textContent = name;
                document.getElementById('previewRegdNo').textContent = regdNo;
                document.getElementById('previewRoomNo').textContent = roomNo;
                document.getElementById('previewPhoneNo').textContent = phoneNo;
                document.getElementById('previewScreenshot').textContent = screenshot ? screenshot.name : 'Not uploaded';
                document.getElementById('previewQuestion').textContent = question || 'None';
                
                // Show the preview popup
                previewPopup.classList.remove('hidden');
            });
            
            // Close popup
            closePopup.addEventListener('click', function() {
                previewPopup.classList.add('hidden');
            });
            
            // Edit button in popup
            editButton.addEventListener('click', function() {
                previewPopup.classList.add('hidden');
            });
            
            // Confirm registration
            confirmButton.addEventListener('click', function() {
                // Show loading state
                const originalText = confirmButton.innerHTML;
                confirmButton.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Processing...';
                confirmButton.disabled = true;
                
                // Submit the form
                form.submit();
            });
            
            // Close popup when clicking outside
            previewPopup.addEventListener('click', function(e) {
                if (e.target === previewPopup) {
                    previewPopup.classList.add('hidden');
                }
            });
            
            // Add input validation styles
            const inputs = document.querySelectorAll('input[type="text"]');
            inputs.forEach(input => {
                input.addEventListener('blur', function() {
                    if (this.value.trim() !== '') {
                        this.classList.add('border-green-400', 'bg-green-50');
                    } else {
                        this.classList.remove('border-green-400', 'bg-green-50');
                    }
                });
            });
        });
    </script>
</body>
</html>
